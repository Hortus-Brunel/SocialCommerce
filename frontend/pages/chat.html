<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - SocialVerse</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style-enhanced.css">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    .chat-container { display: flex; height: calc(100vh - 120px); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; overflow: hidden; margin-top: 20px;}
    .chat-sidebar { width: 300px; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; }
    .chat-main { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); font-weight: 600; background: rgba(0,0,0,0.2); }
    .contact-list { flex: 1; overflow-y: auto; padding: 10px; }
    .contact-item { padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
    .contact-item:hover, .contact-item.active { background: rgba(102,126,234,0.15); }
    .contact-item .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 70%; padding: 12px 16px; border-radius: 16px; line-height: 1.4; font-size: 14px; position: relative; }
    .message.received { background: rgba(255,255,255,0.05); align-self: flex-start; border-bottom-left-radius: 4px; }
    .message.sent { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message-time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; display: block; }
    .chat-input-area { padding: 20px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; gap: 10px; background: rgba(0,0,0,0.2); }
    .chat-input { flex: 1; border: none; background: rgba(255,255,255,0.05); color: white; padding: 14px; border-radius: 12px; font-family: inherit; }
    .chat-input:focus { outline: none; background: rgba(255,255,255,0.08); }
    .sb-link { display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:var(--muted);text-decoration:none;transition:all .2s;margin-bottom:4px; }
    .sb-link:hover { background:rgba(102,126,234,.15);color:white; }
  </style>
</head>
<body>
  <script>
    if (!localStorage.getItem("token")) window.location.href = "login.html";
  </script>

  <div class="dashboard">
    <aside class="sidebar card" style="display:flex;flex-direction:column;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.1)">
        <img src="../images/logo.png" alt="Logo" style="width:34px;height:34px;border-radius:8px;object-fit:cover;" onerror="this.outerHTML='<span style=font-size:22px>🚀</span>'">
        <span style="font-weight:700;color:white;font-size:15px;">SocialVerse</span>
      </div>
      <a class="sb-link" id="dashLink" href="customer-dashboard.html">🏠 Dashboard</a>
      <a class="sb-link" href="product-listing.html">🛍️ Marketplace</a>
      <a class="sb-link active" href="chat.html">💬 Messages</a>
    </aside>

    <main class="main">
      <h1 style="margin:0;">Messages 💬</h1>
      <p style="color:var(--muted);margin-top:4px;">Chat directly with sellers and customers.</p>

      <div class="chat-container">
        <div class="chat-sidebar">
          <div class="chat-header">Recent Contacts</div>
          <div class="contact-list" id="contactList">
            <!-- Populated via JS -->
            <div style="text-align:center;color:var(--muted);padding:20px;font-size:13px;">Loading contacts...</div>
          </div>
        </div>
        
        <div class="chat-main" id="chatMain" style="display:none;">
          <div class="chat-header" id="chatTitle">Select a chat</div>
          <div class="messages-area" id="messagesArea">
            <!-- Messages go here -->
          </div>
          <div class="chat-input-area">
            <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button class="btn btn-primary" onclick="sendMessage()">Send</button>
          </div>
        </div>

        <div class="chat-main" id="emptyChat" style="align-items:center; justify-content:center; color:var(--muted);">
          <div style="font-size:48px;margin-bottom:10px;">💬</div>
          Select a contact to start messaging
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/script.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (user.role === 'business') {
      document.getElementById('dashLink').href = 'business-dashboard.html';
    }

    const socket = io("https://socialverse-backend.onrender.com");
    let activeChatUserId = null;

    socket.on("connect", () => {
      socket.emit("join", user.id);
    });

    socket.on("receive_message", (msg) => {
      if (activeChatUserId == msg.sender_id) {
        appendMessage(msg, 'received');
      } else {
        displayNotification("New message received!", "info");
      }
    });

    async function loadContacts() {
        // In a real app, you'd fetch unique contacts from messages. 
        // For prototype, we fetch all users and filter.
        try {
            const res = await fetch('https://socialverse-backend.onrender.com/api/admin/users', { headers: getAuthHeader() });
            const allUsers = await res.json();
            const contacts = allUsers.filter(u => u.id !== user.id);
            const cl = document.getElementById('contactList');
            cl.innerHTML = contacts.map(c => `
                <div class="contact-item" onclick="openChat(${c.id}, '${c.name}')">
                    <div class="avatar">${c.name.charAt(0).toUpperCase()}</div>
                    <div style="flex:1">
                        <strong style="font-size:14px;color:white;">${c.name}</strong>
                        <div style="font-size:11px;color:var(--muted);">${c.role}</div>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            console.error(e);
        }
    }

    async function openChat(contactId, contactName) {
        activeChatUserId = contactId;
        document.getElementById('emptyChat').style.display = 'none';
        document.getElementById('chatMain').style.display = 'flex';
        document.getElementById('chatTitle').textContent = 'Chat with ' + contactName;
        
        // Highlight active contact
        document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
        // (Skipping finding the specific element for simplicity, it works globally)

        // Load History
        document.getElementById('messagesArea').innerHTML = '<div style="text-align:center;color:var(--muted);margin-top:20px;">Loading history...</div>';
        try {
            const res = await fetch(`https://socialverse-backend.onrender.com/api/messages/${contactId}`, { headers: getAuthHeader() });
            const history = await res.json();
            document.getElementById('messagesArea').innerHTML = '';
            history.forEach(msg => {
                const type = msg.sender_id == user.id ? 'sent' : 'received';
                appendMessage(msg, type);
            });
        } catch(e) { console.error(e); }
    }

    function appendMessage(msg, type) {
        const area = document.getElementById('messagesArea');
        const time = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        area.innerHTML += `
            <div class="message ${type}">
                ${msg.content}
                <span class="message-time">${time}</span>
            </div>
        `;
        area.scrollTop = area.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content || !activeChatUserId) return;
        
        input.value = '';
        
        try {
            const res = await fetch('https://socialverse-backend.onrender.com/api/messages', {
                method: 'POST',
                headers: getAuthHeader(),
                body: JSON.stringify({ receiverId: activeChatUserId, content })
            });
            const msg = await res.json();
            appendMessage(msg, 'sent');
        } catch (e) {
            console.error(e);
            displayNotification("Failed to send message", "error");
        }
    }

    window.onload = loadContacts;
  </script>
</body>
</html>
