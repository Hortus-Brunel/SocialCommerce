<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to SocialVerse - Cameroon's Social Commerce Platform">
  <title>Login - SocialVerse</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style-enhanced.css">
  <style>
    .auth-body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden; }
    .auth-body::before { content:''; position:fixed; top:-50%; left:-50%; width:200%; height:200%; background: radial-gradient(circle at 30% 30%, rgba(102,126,234,0.15) 0%, transparent 60%), radial-gradient(circle at 70% 70%, rgba(118,75,162,0.15) 0%, transparent 60%); pointer-events:none; }
    .auth-container { width: 100%; max-width: 440px; z-index: 1; }
    .auth-card { border-radius: 24px; padding: 40px; }
    .auth-logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 32px; }
    .auth-logo img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
    .auth-logo span { font-size: 22px; font-weight: 800; color: white; }
    .auth-title { text-align: center; margin-bottom: 28px; }
    .auth-title h2 { margin: 0 0 6px; font-size: 26px; }
    .auth-title p { color: var(--muted); margin: 0; font-size: 14px; }
    .form-field { margin-bottom: 16px; }
    .form-field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    .form-field .auth-input { width: 100%; box-sizing: border-box; }
    .error-msg { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3); color: #ef4444; padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }
    .success-msg { background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.3); color: #22c55e; padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }
    .loading-btn { opacity: 0.7; pointer-events: none; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--muted); font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .payment-logos { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); }
    .payment-badge { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 600; }
    .mtn-badge { color: #ffcf00; border-color: rgba(255,207,0,.3); }
    .orange-badge { color: #ff6600; border-color: rgba(255,102,0,.3); }
  </style>
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card card">

      <div class="auth-logo">
        <img src="../images/logo.png" alt="SocialVerse Logo" onerror="this.outerHTML='<span style=font-size:30px>🚀</span>'">
        <span>SocialVerse</span>
      </div>

      <div class="auth-title">
        <h2>🔐 Welcome Back</h2>
        <p>Cameroon's Social Commerce Platform</p>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-field">
          <label for="email">📧 Email Address</label>
          <input type="email" id="email" class="auth-input" placeholder="yourname@example.com" required autocomplete="email">
        </div>

        <div class="form-field">
          <label for="password">🔑 Password</label>
          <input type="password" id="password" class="auth-input" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <div class="form-field" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="rememberMe" style="width: auto;">
          <label for="rememberMe" style="margin: 0;">Remember me for 30 days</label>
        </div>

        <button type="submit" class="btn btn-primary full" id="loginBtn" style="margin-top:8px;">
          Login to SocialVerse
        </button>
      </form>

      <p class="switch" style="text-align:center;margin-top:20px;">
        Don't have an account?
        <a href="register.html">Create account →</a>
      </p>

      <div class="divider">Accepted Payments</div>
      <div class="payment-logos">
        <div class="payment-badge mtn-badge">📱 MTN Money</div>
        <div class="payment-badge orange-badge">🟠 Orange Money</div>
      </div>
    </div>

    <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:16px;">
      🇨🇲 Made for Cameroon · Prices in FCFA
    </p>
  </div>

  <script src="../js/config.js"></script>
  <script>
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = '⚠️ ' + msg;
      el.style.display = 'block';
      document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = '✅ ' + msg;
      el.style.display = 'block';
      document.getElementById('errorMsg').style.display = 'none';
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        showError('Please fill in all fields.');
        return;
      }

      btn.textContent = 'Logging in...';
      btn.classList.add('loading-btn');

      // Try real backend first
      try {
        const response = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, rememberMe })
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.message || data.error || 'Invalid credentials.');
          btn.textContent = 'Login to SocialVerse';
          btn.classList.remove('loading-btn');
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        showSuccess('Login successful! Redirecting...');

        setTimeout(() => {
          const role = data.user.role;
          if (role === 'admin') window.location.href = 'admin-dashboard.html';
          else if (role === 'business') window.location.href = 'business-dashboard.html';
          else window.location.href = 'customer-dashboard.html';
        }, 800);

      } catch (err) {
        // Offline/demo fallback using config.js admin check
        if (email === ADMIN_CONFIG.email && password === ADMIN_CONFIG.password) {
          const user = { name: ADMIN_CONFIG.name, email: ADMIN_CONFIG.email, role: 'admin' };
          localStorage.setItem('token', generateToken());
          localStorage.setItem('user', JSON.stringify(user));
          showSuccess('Admin login successful!');
          setTimeout(() => window.location.href = 'admin-dashboard.html', 800);
        } else {
          showError('Cannot connect to server. Please try again or check your connection.');
          btn.textContent = 'Login to SocialVerse';
          btn.classList.remove('loading-btn');
        }
      }
    }
  </script>
</body>
</html>
